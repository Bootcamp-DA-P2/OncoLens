<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OncoLens — Botón Tour v7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --logo-blue: #0059EF;
    --logo-coral: #FF6B5B;
    --ink-soft: #6B7C8F;

    --size: 280px;       /* tamaño de la lupa */
    --lens-cx: 34.35%;   /* centro de la lente, eje X */
    --lens-cy: 40.52%;   /* centro de la lente, eje Y */
    --lens-d: 50.32%;    /* diámetro del hueco de la lente */
    --onco-nudge: 10px;  /* ajuste óptico de OncoLens hacia la derecha */
  }

  body {
    background: #FBFDFF;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Space Grotesk', -apple-system, sans-serif;
    padding: 40px;
  }

  .tour-link {
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: transform 0.3s ease;
  }

  .tour-link:hover { transform: translateY(-4px); }

  /* Filas de texto alineadas al eje de la lente */
  .axis-row {
    position: relative;
    width: var(--size);
  }

  .axis-row > * {
    position: absolute;
    left: var(--lens-cx);
    top: 50%;
    transform: translate(-50%, -50%);
    white-space: nowrap;
  }

  .row-top    { height: 48px; margin-bottom: -14px; }
  .row-bottom { height: 56px; margin-top: -42px; }

  .tour-label {
    font-size: 30px;
    font-weight: 500;
    letter-spacing: 0.12em;
    word-spacing: -0.16em;
    color: var(--ink-soft);
    text-transform: uppercase;
  }

  .oncolens-text {
    transform: translate(calc(-50% + var(--onco-nudge)), -50%);
    font-size: 44px;
    font-weight: 600;
    color: var(--logo-blue);
    letter-spacing: -0.015em;
    line-height: 1;
  }

  /* ---- LUPA (vectorial) ---- */
  .magnifier {
    position: relative;
    width: var(--size);
    height: var(--size);
    cursor: pointer;
    transition: transform 0.35s ease;
  }

  .tour-link:hover .magnifier { transform: scale(1.05); }

  .magnifier-svg {
    width: 100%;
    height: 100%;
    display: block;
    fill: none;
    stroke: var(--logo-blue);
    filter: drop-shadow(0 6px 18px rgba(0, 89, 239, 0.16));
  }

  .lens {
    position: absolute;
    top: var(--lens-cy);
    left: var(--lens-cx);
    width: var(--lens-d);
    height: var(--lens-d);
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .lens-text {
    position: absolute;
    font-size: 37px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: #000;
    opacity: 1;
    transform: rotateY(0deg) scale(1);
    transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  }

  .lens-helix {
    position: absolute;
    width: 60%;
    height: 76%;
    opacity: 0;
    transform: rotateY(180deg) rotateZ(0deg) scale(0.6);
    transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  }

  .tour-link:hover .lens-text {
    opacity: 0;
    transform: rotateY(180deg) scale(0.7);
  }

  .tour-link:hover .lens-helix {
    opacity: 1;
    transform: rotateY(0deg) rotateZ(360deg) scale(1);
  }

  .helix-svg { width: 100%; height: 100%; }

  .helix-strand {
    fill: none;
    stroke: var(--logo-blue);
    stroke-width: 4;
    stroke-linecap: round;
  }

  .helix-bridge {
    stroke: var(--logo-coral);
    stroke-width: 3.2;
    stroke-linecap: round;
  }
</style>
</head>
<body>

<a href="#tour" class="tour-link">

  <div class="axis-row row-top">
    <div class="tour-label">Ir a</div>
  </div>

  <div class="magnifier">
    <!-- Lupa vectorial. Mango a 38° (antes 45°).
         Toda la figura se reescala un 4% para que la punta siga
         cabiendo en el viewBox; por eso cambian los tres valores
         --lens-cx / --lens-cy / --lens-d de arriba. -->
    <svg class="magnifier-svg" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
      <line x1="244.7" y1="245.9" x2="363.2" y2="338.5" stroke-width="57.5" stroke-linecap="round"/>
      <circle cx="137.4" cy="162.1" r="115.0" stroke-width="28.8"/>
    </svg>

    <div class="lens">
      <div class="lens-text">TOUR</div>

      <div class="lens-helix">
        <svg class="helix-svg" viewBox="0 0 60 100" xmlns="http://www.w3.org/2000/svg">
          <path d="M18 4 C 44 22, 44 32, 18 50 C -6 68, -6 78, 18 96" class="helix-strand"/>
          <path d="M42 4 C 16 22, 16 32, 42 50 C 66 68, 66 78, 42 96" class="helix-strand"/>
          <line x1="22" y1="14" x2="38" y2="14" class="helix-bridge"/>
          <line x1="26" y1="26" x2="34" y2="26" class="helix-bridge"/>
          <line x1="22" y1="38" x2="38" y2="38" class="helix-bridge"/>
          <line x1="22" y1="62" x2="38" y2="62" class="helix-bridge"/>
          <line x1="26" y1="74" x2="34" y2="74" class="helix-bridge"/>
          <line x1="22" y1="86" x2="38" y2="86" class="helix-bridge"/>
        </svg>
      </div>
    </div>
  </div>

  <div class="axis-row row-bottom">
    <div class="oncolens-text">OncoLens</div>
  </div>

</a>

</body>
</html>
